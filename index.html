<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブロック図エディタ</title>
  <style>
    /* ===== リセット ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif;
      background: #1a202c;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ===== ツールバー ===== */
    #toolbar {
      flex-shrink: 0;
      height: 48px;
      background: #2d3748;
      border-bottom: 1px solid #4a5568;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      z-index: 10;
    }

    #toolbar .app-title {
      font-size: 14px;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 0.05em;
      margin-right: 8px;
      white-space: nowrap;
    }

    .tb-sep {
      width: 1px;
      height: 28px;
      background: #4a5568;
      margin: 0 6px;
      flex-shrink: 0;
    }

    .tb-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border: 1.5px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: #a0aec0;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      flex-shrink: 0;
    }
    .tb-btn:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
    .tb-btn.active {
      background: #4299e1;
      border-color: #63b3ed;
      color: #fff;
    }
    .tb-btn.danger { color: #fc8181; }
    .tb-btn.danger:hover { background: rgba(252,129,129,0.12); color: #fc8181; }

    .tb-btn .icon { font-size: 15px; line-height: 1; }
    .tb-btn .label { font-size: 12px; }

    /* ===== キャンバスエリア ===== */
    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: default;
    }

    /* ===== コンテキストメニュー ===== */
    #ctx-menu {
      position: fixed;
      display: none;
      background: #2d3748;
      border: 1px solid #4a5568;
      border-radius: 8px;
      padding: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 200;
      min-width: 160px;
    }
    .ctx-item {
      padding: 8px 14px;
      font-size: 13px;
      color: #e2e8f0;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .ctx-item:hover { background: rgba(255,255,255,0.1); }
    .ctx-item.danger { color: #fc8181; }
    .ctx-item.danger:hover { background: rgba(252,129,129,0.1); }
    .ctx-sep {
      height: 1px;
      background: #4a5568;
      margin: 4px 0;
    }

    /* ===== インラインテキスト編集 ===== */
    #text-editor {
      position: fixed;
      display: none;
      z-index: 300;
      background: #fff;
      border: 2px solid #4299e1;
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 13px;
      font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif;
      color: #1a202c;
      text-align: center;
      outline: none;
      resize: none;
      overflow: hidden;
      box-shadow: 0 0 0 3px rgba(66,153,225,0.3);
    }

    /* ===== ステータスバー ===== */
    #status-bar {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #e2e8f0;
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      white-space: nowrap;
      z-index: 100;
    }
    #status-bar.show { opacity: 1; }

    /* ===== ファイル入力（非表示） ===== */
    #file-input { display: none; }
  </style>
</head>
<body>

<!-- ツールバー -->
<div id="toolbar">
  <span class="app-title">📐 ブロック図</span>

  <div class="tb-sep"></div>

  <!-- 操作ツール -->
  <button class="tb-btn active" id="btn-select" title="選択・移動 (V)">
    <span class="icon">↖</span><span class="label">選択</span>
  </button>
  <button class="tb-btn" id="btn-block" title="ブロック追加 (B)">
    <span class="icon">▭</span><span class="label">ブロック</span>
  </button>
  <button class="tb-btn" id="btn-arrow" title="矢印 (A)">
    <span class="icon">→</span><span class="label">矢印</span>
  </button>

  <div class="tb-sep"></div>

  <!-- 編集 -->
  <button class="tb-btn danger" id="btn-delete" title="削除 (Del)">
    <span class="icon">✕</span><span class="label">削除</span>
  </button>

  <div class="tb-sep"></div>

  <!-- ファイル -->
  <button class="tb-btn" id="btn-save" title="保存 (Ctrl+S)">
    <span class="icon">💾</span><span class="label">保存</span>
  </button>
  <button class="tb-btn" id="btn-load" title="読込">
    <span class="icon">📂</span><span class="label">読込</span>
  </button>
  <button class="tb-btn danger" id="btn-clear" title="クリア">
    <span class="icon">🗑</span><span class="label">クリア</span>
  </button>

  <input type="file" id="file-input" accept=".json">
</div>

<!-- SVG キャンバス -->
<div id="canvas-wrap">
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg">

    <!-- マーカー定義 -->
    <defs>
      <!-- 通常矢印ヘッド -->
      <marker id="ah-normal" markerWidth="10" markerHeight="7"
              refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 10 3.5, 0 7" fill="#a0aec0"/>
      </marker>
      <!-- 選択中矢印ヘッド -->
      <marker id="ah-selected" markerWidth="10" markerHeight="7"
              refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 10 3.5, 0 7" fill="#4299e1"/>
      </marker>
      <!-- 背景グリッド -->
      <pattern id="grid-sm" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2d3748" stroke-width="0.5"/>
      </pattern>
      <pattern id="grid-lg" width="100" height="100" patternUnits="userSpaceOnUse">
        <rect width="100" height="100" fill="url(#grid-sm)"/>
        <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#374151" stroke-width="1"/>
      </pattern>
    </defs>

    <!-- 背景 -->
    <rect id="bg" width="100%" height="100%" fill="#1e2533"/>
    <rect id="bg-grid" width="100%" height="100%" fill="url(#grid-lg)"/>

    <!-- 描画レイヤー（順番重要：矢印→ブロック→オーバーレイ） -->
    <g id="layer-arrows"></g>
    <g id="layer-blocks"></g>
    <g id="layer-overlay"></g>
  </svg>
</div>

<!-- コンテキストメニュー -->
<div id="ctx-menu">
  <div class="ctx-item" id="ctx-edit">✏️ テキスト編集</div>
  <div class="ctx-item" id="ctx-label">🏷 ラベル編集</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" id="ctx-delete">✕ 削除</div>
</div>

<!-- インラインテキストエディタ -->
<textarea id="text-editor" rows="1" spellcheck="false"></textarea>

<!-- ステータスバー -->
<div id="status-bar"></div>

<script>
// ============================================================
// ユーティリティ
// ============================================================
const statusBar = document.getElementById('status-bar');
function showStatus(msg, ms = 2500) {
  statusBar.textContent = msg;
  statusBar.classList.add('show');
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(() => statusBar.classList.remove('show'), ms);
}

// ============================================================
// ステップ2: データモデル
// ============================================================

/**
 * Block（ブロック）
 * {
 *   id     : number          — 一意ID
 *   x, y   : number          — 左上座標
 *   w, h   : number          — 幅・高さ
 *   text   : string          — 表示テキスト（改行可）
 * }
 *
 * Arrow（矢印）
 * {
 *   id         : number
 *   start      : Endpoint    — 始点
 *   end        : Endpoint    — 終点
 *   waypoints  : {x,y}[]     — 中間折れ点（0個以上）
 *   label      : string      — 矢印ラベル
 * }
 *
 * Endpoint（接続端点）
 * {
 *   blockId : number|null  — 接続先ブロックID（null=フリー）
 *   side    : 'top'|'right'|'bottom'|'left'|null
 *   t       : number|null  — 辺上の位置 0..1
 *   x, y    : number       — キャッシュ座標（フリー時はそのまま使用）
 * }
 */

// --- アプリ状態 ---
const state = {
  // データ
  blocks   : new Map(),   // id -> Block
  arrows   : new Map(),   // id -> Arrow
  nextId   : 1,

  // ツール: 'select' | 'block' | 'arrow'
  tool     : 'select',

  // 選択: { type: 'block'|'arrow', id } | null
  selection: null,

  // ドラッグ中の情報（種類によって構造が変わる）
  drag     : null,

  // 矢印描画中の情報
  drawing  : null,
  /*
   * drawing = {
   *   points     : {x,y}[]       — クリックで確定した点（先頭=始点）
   *   startSnap  : Endpoint|null — 始点のスナップ情報
   *   curMouse   : {x,y}         — 現在のマウス位置
   *   snapTarget : SnapTarget|null — 現在スナップ中のターゲット
   *   lastClick  : number        — 最後のクリック時刻（ms）
   * }
   */
};

// --- ヘルパー ---
function nextId() { return state.nextId++; }

/** Block を新規作成してstateに追加 */
function createBlock(x, y, w, h, text = 'コンポーネント') {
  const id = nextId();
  state.blocks.set(id, { id, x, y, w, h, text });
  return id;
}

/** Arrow を新規作成してstateに追加 */
function createArrow(start, end, waypoints = [], label = '') {
  const id = nextId();
  state.arrows.set(id, { id, start, end, waypoints, label });
  return id;
}

/** Endpoint を生成（ブロック接続あり） */
function makeSnapEndpoint(blockId, side, t, x, y) {
  return { blockId, side, t, x, y };
}

/** Endpoint を生成（フリー） */
function makeFreeEndpoint(x, y) {
  return { blockId: null, side: null, t: null, x, y };
}

/** 選択をセット */
function setSelection(type, id) {
  state.selection = { type, id };
}

/** 選択を解除 */
function clearSelection() {
  state.selection = null;
}

/** 選択中の要素を削除 */
function deleteSelected() {
  if (!state.selection) return;
  const { type, id } = state.selection;
  if (type === 'block') {
    state.blocks.delete(id);
    // 接続している矢印も削除
    for (const [aid, arrow] of state.arrows) {
      if (arrow.start.blockId === id || arrow.end.blockId === id) {
        state.arrows.delete(aid);
      }
    }
  } else if (type === 'arrow') {
    state.arrows.delete(id);
  }
  clearSelection();
}

// --- シリアライズ / デシリアライズ ---
function serialize() {
  return JSON.stringify({
    version : 1,
    nextId  : state.nextId,
    blocks  : [...state.blocks.values()],
    arrows  : [...state.arrows.values()],
  }, null, 2);
}

function deserialize(json) {
  const data = JSON.parse(json);
  state.blocks.clear();
  state.arrows.clear();
  (data.blocks || []).forEach(b => state.blocks.set(b.id, b));
  (data.arrows || []).forEach(a => state.arrows.set(a.id, a));
  state.nextId   = data.nextId ?? 1;
  state.selection = null;
  state.drag      = null;
  state.drawing   = null;
}

// ============================================================
// ステップ3: ジオメトリ関数
// ============================================================

const SNAP_DIST   = 24;   // スナップ有効距離（px）
const HIT_ARROW   = 8;    // 矢印クリック判定の太さ（px）
const HANDLE_R    = 6;    // ハンドル半径（px）
const MIN_W       = 80;
const MIN_H       = 40;
const DEFAULT_W   = 140;
const DEFAULT_H   = 60;

// --- 基本 ---
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist2(ax, ay, bx, by) { return Math.hypot(bx - ax, by - ay); }

// --- ブロック周囲点 ---

/**
 * side + t からブロック辺上の絶対座標を返す
 * top   : t=0 → 左上,  t=1 → 右上
 * right : t=0 → 右上,  t=1 → 右下
 * bottom: t=0 → 右下,  t=1 → 左下
 * left  : t=0 → 左下,  t=1 → 左上
 */
function perimeterPoint(block, side, t) {
  const { x, y, w, h } = block;
  switch (side) {
    case 'top'   : return { x: x + t * w,       y: y           };
    case 'right' : return { x: x + w,            y: y + t * h   };
    case 'bottom': return { x: x + w - t * w,    y: y + h       };
    case 'left'  : return { x: x,                y: y + h - t * h };
  }
}

/**
 * 点 (px,py) に最も近いブロック辺上の点を返す
 * 戻り値: { side, t, x, y, dist }
 */
function nearestPerimeterPoint(block, px, py) {
  const { x, y, w, h } = block;

  // 各辺の最近傍点（辺上にクランプ）
  const candidates = [
    { side: 'top',    cx: clamp(px, x, x+w), cy: y           },
    { side: 'right',  cx: x+w,               cy: clamp(py, y, y+h) },
    { side: 'bottom', cx: clamp(px, x, x+w), cy: y+h         },
    { side: 'left',   cx: x,                 cy: clamp(py, y, y+h) },
  ];

  // t パラメータを計算
  candidates[0].t = w > 0 ? (candidates[0].cx - x) / w : 0;
  candidates[1].t = h > 0 ? (candidates[1].cy - y) / h : 0;
  candidates[2].t = w > 0 ? (x + w - candidates[2].cx) / w : 0;
  candidates[3].t = h > 0 ? (y + h - candidates[3].cy) / h : 0;

  let best = null, bestD = Infinity;
  for (const c of candidates) {
    const d = dist2(c.cx, c.cy, px, py);
    if (d < bestD) { bestD = d; best = c; }
  }
  return { side: best.side, t: best.t, x: best.cx, y: best.cy, dist: bestD };
}

/**
 * Endpoint の実座標を返す
 * ブロック接続の場合は現在のブロック位置から計算し直す
 */
function resolveEndpoint(ep) {
  if (ep.blockId != null) {
    const block = state.blocks.get(ep.blockId);
    if (block) return perimeterPoint(block, ep.side, ep.t);
  }
  return { x: ep.x, y: ep.y };
}

// --- 矢印ポイント列 ---

/** 矢印の全座標列 [始点, ...中間点, 終点] を返す */
function arrowPoints(arrow) {
  return [
    resolveEndpoint(arrow.start),
    ...arrow.waypoints,
    resolveEndpoint(arrow.end),
  ];
}

/** 矢印の中間点（ラベル位置）を返す */
function arrowMidpoint(arrow) {
  const pts = arrowPoints(arrow);
  let total = 0;
  const segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const d = dist2(pts[i].x, pts[i].y, pts[i+1].x, pts[i+1].y);
    segs.push(d);
    total += d;
  }
  let remain = total / 2;
  for (let i = 0; i < segs.length; i++) {
    if (remain <= segs[i] + 1e-9) {
      const t = segs[i] > 0 ? remain / segs[i] : 0;
      return {
        x: pts[i].x + t * (pts[i+1].x - pts[i].x),
        y: pts[i].y + t * (pts[i+1].y - pts[i].y),
      };
    }
    remain -= segs[i];
  }
  return pts[Math.floor(pts.length / 2)];
}

// --- ヒットテスト ---

/** 点が矩形の内側かどうか */
function pointInBlock(block, px, py) {
  return px >= block.x && px <= block.x + block.w
      && py >= block.y && py <= block.y + block.h;
}

/** 点が線分の近傍かどうか */
function pointNearSegment(px, py, x1, y1, x2, y2, threshold) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx*dx + dy*dy;
  if (len2 === 0) return dist2(px, py, x1, y1) <= threshold;
  const t = clamp(((px-x1)*dx + (py-y1)*dy) / len2, 0, 1);
  return dist2(px, py, x1 + t*dx, y1 + t*dy) <= threshold;
}

/** 点が矢印ライン上にあるか */
function pointOnArrow(arrow, px, py) {
  const pts = arrowPoints(arrow);
  for (let i = 0; i < pts.length - 1; i++) {
    if (pointNearSegment(px, py, pts[i].x, pts[i].y,
                                 pts[i+1].x, pts[i+1].y, HIT_ARROW)) return true;
  }
  return false;
}

/**
 * (px,py) でヒットした要素を返す
 * 優先順: ブロック > 矢印
 * 戻り値: { type:'block'|'arrow', id } | null
 */
function hitTest(px, py) {
  // ブロックは後から追加されたものが手前 → Mapの末尾から検索
  const blocks = [...state.blocks.values()];
  for (let i = blocks.length - 1; i >= 0; i--) {
    if (pointInBlock(blocks[i], px, py)) return { type: 'block', id: blocks[i].id };
  }
  const arrows = [...state.arrows.values()];
  for (let i = arrows.length - 1; i >= 0; i--) {
    if (pointOnArrow(arrows[i], px, py)) return { type: 'arrow', id: arrows[i].id };
  }
  return null;
}

// --- スナップ検出 ---

/**
 * (px,py) に近いブロック辺のスナップ点を探す
 * excludeId: 除外するブロックID（矢印始点のブロックなど）
 * 戻り値: { blockId, side, t, x, y } | null
 */
function findSnap(px, py, excludeId = null) {
  let best = null, bestD = SNAP_DIST;
  for (const block of state.blocks.values()) {
    if (block.id === excludeId) continue;
    const p = nearestPerimeterPoint(block, px, py);
    if (p.dist < bestD) {
      bestD = p.dist;
      best = { blockId: block.id, side: p.side, t: p.t, x: p.x, y: p.y };
    }
  }
  return best;
}

// --- リサイズハンドル ---

/**
 * 選択中ブロックのリサイズハンドル一覧を返す
 * 各ハンドル: { x, y, dir }
 * dir は 'n'|'ne'|'e'|'se'|'s'|'sw'|'w'|'nw' (compass 方向)
 */
function resizeHandles(block) {
  const { x, y, w, h } = block;
  return [
    { x: x+w/2, y: y,     dir: 'n'  },
    { x: x+w,   y: y,     dir: 'ne' },
    { x: x+w,   y: y+h/2, dir: 'e'  },
    { x: x+w,   y: y+h,   dir: 'se' },
    { x: x+w/2, y: y+h,   dir: 's'  },
    { x: x,     y: y+h,   dir: 'sw' },
    { x: x,     y: y+h/2, dir: 'w'  },
    { x: x,     y: y,     dir: 'nw' },
  ];
}

/** (px,py) に近いリサイズハンドルを返す（なければ null） */
function hitResizeHandle(block, px, py) {
  for (const h of resizeHandles(block)) {
    if (dist2(px, py, h.x, h.y) <= HANDLE_R + 2) return h;
  }
  return null;
}

/** (px,py) に近いウェイポイントハンドルを返す（なければ null） */
function hitWaypointHandle(arrow, px, py) {
  for (let i = 0; i < arrow.waypoints.length; i++) {
    const wp = arrow.waypoints[i];
    if (dist2(px, py, wp.x, wp.y) <= HANDLE_R + 2) return i;
  }
  return null;
}

/**
 * セグメント中点ハンドルへのヒット
 * 戻り値: セグメントインデックス | null
 * （このセグメントの直後にウェイポイントを挿入する）
 */
function hitSegmentMid(arrow, px, py) {
  const pts = arrowPoints(arrow);
  for (let i = 0; i < pts.length - 1; i++) {
    const mx = (pts[i].x + pts[i+1].x) / 2;
    const my = (pts[i].y + pts[i+1].y) / 2;
    if (dist2(px, py, mx, my) <= HANDLE_R + 2) return i;
  }
  return null;
}

// --- SVG座標取得 ---
const svgEl = document.getElementById('canvas');
function svgPoint(e) {
  const r = svgEl.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

// 動作確認
showStatus('ステップ3完了: ジオメトリ関数OK ✔');
</script>
</body>
</html>
