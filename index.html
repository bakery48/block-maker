<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブロック図エディタ</title>
  <style>
    /* ===== リセット ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif;
      background: #1a202c;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ===== ツールバー ===== */
    #toolbar {
      flex-shrink: 0;
      height: 48px;
      background: #2d3748;
      border-bottom: 1px solid #4a5568;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      z-index: 10;
    }

    #toolbar .app-title {
      font-size: 14px;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 0.05em;
      margin-right: 8px;
      white-space: nowrap;
    }

    .tb-sep {
      width: 1px;
      height: 28px;
      background: #4a5568;
      margin: 0 6px;
      flex-shrink: 0;
    }

    .tb-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border: 1.5px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: #a0aec0;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      flex-shrink: 0;
    }
    .tb-btn:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
    .tb-btn.active {
      background: #4299e1;
      border-color: #63b3ed;
      color: #fff;
    }
    .tb-btn.danger { color: #fc8181; }
    .tb-btn.danger:hover { background: rgba(252,129,129,0.12); color: #fc8181; }

    .tb-btn .icon { font-size: 15px; line-height: 1; }
    .tb-btn .label { font-size: 12px; }

    /* ===== キャンバスエリア ===== */
    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: default;
    }

    /* ===== コンテキストメニュー ===== */
    #ctx-menu {
      position: fixed;
      display: none;
      background: #2d3748;
      border: 1px solid #4a5568;
      border-radius: 8px;
      padding: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 200;
      min-width: 160px;
    }
    .ctx-item {
      padding: 8px 14px;
      font-size: 13px;
      color: #e2e8f0;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .ctx-item:hover { background: rgba(255,255,255,0.1); }
    .ctx-item.danger { color: #fc8181; }
    .ctx-item.danger:hover { background: rgba(252,129,129,0.1); }
    .ctx-sep {
      height: 1px;
      background: #4a5568;
      margin: 4px 0;
    }

    /* ===== インラインテキスト編集 ===== */
    #text-editor {
      position: fixed;
      display: none;
      z-index: 300;
      background: #fff;
      border: 2px solid #4299e1;
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 13px;
      font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif;
      color: #1a202c;
      text-align: center;
      outline: none;
      resize: none;
      overflow: hidden;
      box-shadow: 0 0 0 3px rgba(66,153,225,0.3);
    }

    /* ===== ステータスバー ===== */
    #status-bar {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #e2e8f0;
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      white-space: nowrap;
      z-index: 100;
    }
    #status-bar.show { opacity: 1; }

    /* ===== ファイル入力（非表示） ===== */
    #file-input { display: none; }
  </style>
</head>
<body>

<!-- ツールバー -->
<div id="toolbar">
  <span class="app-title">📐 ブロック図</span>

  <div class="tb-sep"></div>

  <!-- 操作ツール -->
  <button class="tb-btn active" id="btn-select" title="選択・移動 (V)">
    <span class="icon">↖</span><span class="label">選択</span>
  </button>
  <button class="tb-btn" id="btn-block" title="ブロック追加 (B)">
    <span class="icon">▭</span><span class="label">ブロック</span>
  </button>
  <button class="tb-btn" id="btn-arrow" title="矢印 (A)">
    <span class="icon">→</span><span class="label">矢印</span>
  </button>

  <div class="tb-sep"></div>

  <!-- 編集 -->
  <button class="tb-btn danger" id="btn-delete" title="削除 (Del)">
    <span class="icon">✕</span><span class="label">削除</span>
  </button>

  <div class="tb-sep"></div>

  <!-- ファイル -->
  <button class="tb-btn" id="btn-save" title="保存 (Ctrl+S)">
    <span class="icon">💾</span><span class="label">保存</span>
  </button>
  <button class="tb-btn" id="btn-load" title="読込">
    <span class="icon">📂</span><span class="label">読込</span>
  </button>
  <button class="tb-btn danger" id="btn-clear" title="クリア">
    <span class="icon">🗑</span><span class="label">クリア</span>
  </button>

  <input type="file" id="file-input" accept=".json">
</div>

<!-- SVG キャンバス -->
<div id="canvas-wrap">
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg">

    <!-- マーカー定義 -->
    <defs>
      <!-- 通常矢印ヘッド -->
      <marker id="ah-normal" markerWidth="10" markerHeight="7"
              refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 10 3.5, 0 7" fill="#a0aec0"/>
      </marker>
      <!-- 選択中矢印ヘッド -->
      <marker id="ah-selected" markerWidth="10" markerHeight="7"
              refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 10 3.5, 0 7" fill="#4299e1"/>
      </marker>
      <!-- 背景グリッド -->
      <pattern id="grid-sm" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2d3748" stroke-width="0.5"/>
      </pattern>
      <pattern id="grid-lg" width="100" height="100" patternUnits="userSpaceOnUse">
        <rect width="100" height="100" fill="url(#grid-sm)"/>
        <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#374151" stroke-width="1"/>
      </pattern>
    </defs>

    <!-- 背景 -->
    <rect id="bg" width="100%" height="100%" fill="#1e2533"/>
    <rect id="bg-grid" width="100%" height="100%" fill="url(#grid-lg)"/>

    <!-- 描画レイヤー（順番重要：矢印→ブロック→オーバーレイ） -->
    <g id="layer-arrows"></g>
    <g id="layer-blocks"></g>
    <g id="layer-overlay"></g>
  </svg>
</div>

<!-- コンテキストメニュー -->
<div id="ctx-menu">
  <div class="ctx-item" id="ctx-edit">✏️ テキスト編集</div>
  <div class="ctx-item" id="ctx-label">🏷 ラベル編集</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" id="ctx-delete">✕ 削除</div>
</div>

<!-- インラインテキストエディタ -->
<textarea id="text-editor" rows="1" spellcheck="false"></textarea>

<!-- ステータスバー -->
<div id="status-bar"></div>

<script>
// ============================================================
// ステップ1: 骨格確認用のプレースホルダー
// （ステップ2以降で順次実装）
// ============================================================
console.log('ブロック図エディタ: 骨格ロード完了');

// ツールボタンの仮クリックイベント（動作確認用）
document.querySelectorAll('.tb-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    // ツール系ボタンのみアクティブ切替
    const toolBtns = ['btn-select','btn-block','btn-arrow'];
    if (toolBtns.includes(btn.id)) {
      toolBtns.forEach(id => document.getElementById(id).classList.remove('active'));
      btn.classList.add('active');
    }
  });
});

// ステータスバー表示テスト
const statusBar = document.getElementById('status-bar');
function showStatus(msg, ms = 2500) {
  statusBar.textContent = msg;
  statusBar.classList.add('show');
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(() => statusBar.classList.remove('show'), ms);
}
showStatus('ステップ1完了: 骨格OK ✔');
</script>
</body>
</html>
