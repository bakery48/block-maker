<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブロック図エディタ</title>
  <style>
    /* ===== リセット ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif;
      background: #1a202c;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ===== ツールバー ===== */
    #toolbar {
      flex-shrink: 0;
      height: 48px;
      background: #2d3748;
      border-bottom: 1px solid #4a5568;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      z-index: 10;
    }

    #toolbar .app-title {
      font-size: 14px;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 0.05em;
      margin-right: 8px;
      white-space: nowrap;
    }

    .tb-sep {
      width: 1px;
      height: 28px;
      background: #4a5568;
      margin: 0 6px;
      flex-shrink: 0;
    }

    .tb-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border: 1.5px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: #a0aec0;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      flex-shrink: 0;
    }
    .tb-btn:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
    .tb-btn.active {
      background: #4299e1;
      border-color: #63b3ed;
      color: #fff;
    }
    .tb-btn.danger { color: #fc8181; }
    .tb-btn.danger:hover { background: rgba(252,129,129,0.12); color: #fc8181; }

    .tb-btn .icon { font-size: 15px; line-height: 1; }
    .tb-btn .label { font-size: 12px; }

    /* ===== キャンバスエリア ===== */
    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: default;
    }

    /* ===== コンテキストメニュー ===== */
    #ctx-menu {
      position: fixed;
      display: none;
      background: #2d3748;
      border: 1px solid #4a5568;
      border-radius: 8px;
      padding: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 200;
      min-width: 160px;
    }
    .ctx-item {
      padding: 8px 14px;
      font-size: 13px;
      color: #e2e8f0;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .ctx-item:hover { background: rgba(255,255,255,0.1); }
    .ctx-item.danger { color: #fc8181; }
    .ctx-item.danger:hover { background: rgba(252,129,129,0.1); }
    .ctx-sep {
      height: 1px;
      background: #4a5568;
      margin: 4px 0;
    }

    /* ===== インラインテキスト編集 ===== */
    #text-editor {
      position: fixed;
      display: none;
      z-index: 300;
      background: #fff;
      border: 2px solid #4299e1;
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 13px;
      font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif;
      color: #1a202c;
      text-align: center;
      outline: none;
      resize: none;
      overflow: hidden;
      box-shadow: 0 0 0 3px rgba(66,153,225,0.3);
    }

    /* ===== ステータスバー ===== */
    #status-bar {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #e2e8f0;
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      white-space: nowrap;
      z-index: 100;
    }
    #status-bar.show { opacity: 1; }

    /* ===== ファイル入力（非表示） ===== */
    #file-input { display: none; }

    /* ===== カラーピッカー ===== */
    #color-picker {
      position: fixed;
      bottom: 46px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 6px;
      background: #2d3748;
      border: 1px solid #4a5568;
      border-radius: 10px;
      padding: 7px 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      z-index: 90;
    }
    #color-picker.show { display: flex; }
    #color-picker .cp-label {
      font-size: 11px;
      color: #718096;
      margin-right: 2px;
      white-space: nowrap;
    }
    .cp-swatch {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.1s;
      flex-shrink: 0;
    }
    .cp-swatch:hover { transform: scale(1.2); }
    .cp-swatch.active { border-color: #fff; transform: scale(1.15); }
  </style>
</head>
<body>

<!-- ツールバー -->
<div id="toolbar">
  <span class="app-title">📐 ブロック図</span>

  <div class="tb-sep"></div>

  <!-- 操作ツール -->
  <button class="tb-btn active" id="btn-select" title="選択・移動 (V)">
    <span class="icon">↖</span><span class="label">選択</span>
  </button>
  <button class="tb-btn" id="btn-block" title="ブロック追加 (B)">
    <span class="icon">▭</span><span class="label">ブロック</span>
  </button>
  <button class="tb-btn" id="btn-arrow" title="矢印 (A)">
    <span class="icon">→</span><span class="label">矢印</span>
  </button>

  <div class="tb-sep"></div>

  <!-- グループ -->
  <button class="tb-btn" id="btn-group"   title="グループ化 (Ctrl+G)">
    <span class="icon">⊞</span><span class="label">グループ</span>
  </button>
  <button class="tb-btn" id="btn-ungroup" title="グループ解除 (Ctrl+Shift+G)">
    <span class="icon">⊟</span><span class="label">解除</span>
  </button>

  <div class="tb-sep"></div>

  <!-- 編集 -->
  <button class="tb-btn danger" id="btn-delete" title="削除 (Del)">
    <span class="icon">✕</span><span class="label">削除</span>
  </button>

  <div class="tb-sep"></div>

  <!-- ファイル -->
  <button class="tb-btn" id="btn-save" title="保存 (Ctrl+S)">
    <span class="icon">💾</span><span class="label">保存</span>
  </button>
  <button class="tb-btn" id="btn-load" title="読込">
    <span class="icon">📂</span><span class="label">読込</span>
  </button>
  <button class="tb-btn" id="btn-png" title="PNG出力">
    <span class="icon">📷</span><span class="label">PNG</span>
  </button>
  <button class="tb-btn danger" id="btn-clear" title="クリア">
    <span class="icon">🗑</span><span class="label">クリア</span>
  </button>

  <input type="file" id="file-input" accept=".json">
</div>

<!-- SVG キャンバス -->
<div id="canvas-wrap">
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg">

    <!-- マーカー定義（色別マーカーはJS側で生成） -->
    <defs id="svg-defs">
      <!-- 背景グリッド -->
      <pattern id="grid-sm" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2d3748" stroke-width="0.5"/>
      </pattern>
      <pattern id="grid-lg" width="100" height="100" patternUnits="userSpaceOnUse">
        <rect width="100" height="100" fill="url(#grid-sm)"/>
        <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#374151" stroke-width="1"/>
      </pattern>
    </defs>

    <!-- 背景 -->
    <rect id="bg" width="100%" height="100%" fill="#1e2533"/>
    <rect id="bg-grid" width="100%" height="100%" fill="url(#grid-lg)"/>

    <!-- 描画レイヤー（順番重要：グループ枠→矢印→ブロック→オーバーレイ） -->
    <g id="layer-groups"></g>
    <g id="layer-arrows"></g>
    <g id="layer-blocks"></g>
    <g id="layer-overlay"></g>
  </svg>
</div>

<!-- コンテキストメニュー -->
<div id="ctx-menu">
  <div class="ctx-item" id="ctx-edit">✏️ テキスト編集</div>
  <div class="ctx-item" id="ctx-label">🏷 ラベル編集</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" id="ctx-delete">✕ 削除</div>
</div>

<!-- インラインテキストエディタ -->
<textarea id="text-editor" rows="1" spellcheck="false"></textarea>

<!-- カラーピッカー（選択時に表示） -->
<div id="color-picker">
  <span class="cp-label">カラー:</span>
</div>

<!-- ステータスバー -->
<div id="status-bar"></div>

<script>
// ============================================================
// カラーパレット（12色）
// ============================================================
const PALETTE = [
  '#63b3ed',  // ブルー（デフォルト）
  '#4fd1c5',  // ティール
  '#68d391',  // グリーン
  '#f6e05e',  // イエロー
  '#f6ad55',  // オレンジ
  '#fc8181',  // レッド
  '#f687b3',  // ピンク
  '#b794f4',  // パープル
  '#76e4f7',  // シアン
  '#fbb6ce',  // ローズ
  '#a0aec0',  // グレー
  '#e2e8f0',  // ホワイト
];

const DEFAULT_BLOCK_COLOR = '#63b3ed';
const DEFAULT_ARROW_COLOR = '#a0aec0';

// --- 矢印ヘッドマーカーを色ごとに <defs> に生成 ---
(function buildMarkers() {
  const defs   = document.getElementById('svg-defs');
  const colors = [...new Set([...PALETTE, DEFAULT_ARROW_COLOR, DEFAULT_BLOCK_COLOR])];

  // グリッドパターンも defs に移動（HTMLのdefs削除に伴い再生成）
  function pat(id, w, h, inner) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'pattern');
    p.setAttribute('id', id);
    p.setAttribute('width', w); p.setAttribute('height', h);
    p.setAttribute('patternUnits', 'userSpaceOnUse');
    p.innerHTML = inner;
    defs.appendChild(p);
  }
  pat('grid-sm', 20, 20, '<path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2d3748" stroke-width="0.5"/>');
  pat('grid-lg', 100, 100,
    '<rect width="100" height="100" fill="url(#grid-sm)"/>' +
    '<path d="M 100 0 L 0 0 0 100" fill="none" stroke="#374151" stroke-width="1"/>');

  colors.forEach(hex => createArrowMarker(hex, defs));
})();

/** 指定色のマーカーを defs に追加（なければ）してIDを返す */
function createArrowMarker(hex, defs) {
  const id = 'ah-' + hex.replace('#', '');
  if (document.getElementById(id)) return id;
  defs = defs || document.getElementById('svg-defs');
  const m = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
  m.setAttribute('id',           id);
  m.setAttribute('markerWidth',  '10');
  m.setAttribute('markerHeight', '7');
  m.setAttribute('refX',         '9');
  m.setAttribute('refY',         '3.5');
  m.setAttribute('orient',       'auto');
  m.setAttribute('markerUnits',  'strokeWidth');
  const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  poly.setAttribute('points', '0 0, 10 3.5, 0 7');
  poly.setAttribute('fill', hex);
  m.appendChild(poly);
  defs.appendChild(m);
  return id;
}

// ============================================================
// ユーティリティ
// ============================================================
const statusBar = document.getElementById('status-bar');
function showStatus(msg, ms = 2500) {
  statusBar.textContent = msg;
  statusBar.classList.add('show');
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(() => statusBar.classList.remove('show'), ms);
}

// ============================================================
// ステップ2: データモデル
// ============================================================

/**
 * Block（ブロック）
 * {
 *   id     : number          — 一意ID
 *   x, y   : number          — 左上座標
 *   w, h   : number          — 幅・高さ
 *   text   : string          — 表示テキスト（改行可）
 * }
 *
 * Arrow（矢印）
 * {
 *   id         : number
 *   start      : Endpoint    — 始点
 *   end        : Endpoint    — 終点
 *   waypoints  : {x,y}[]     — 中間折れ点（0個以上）
 *   label      : string      — 矢印ラベル
 * }
 *
 * Endpoint（接続端点）
 * {
 *   blockId : number|null  — 接続先ブロックID（null=フリー）
 *   side    : 'top'|'right'|'bottom'|'left'|null
 *   t       : number|null  — 辺上の位置 0..1
 *   x, y    : number       — キャッシュ座標（フリー時はそのまま使用）
 * }
 */

// --- アプリ状態 ---
const state = {
  // データ
  blocks   : new Map(),   // id -> Block
  arrows   : new Map(),   // id -> Arrow
  nextId   : 1,

  // ツール: 'select' | 'block' | 'arrow'
  tool     : 'select',

  // 複数選択: Map< "block-1"|"arrow-2", {type,id} >
  selections: new Map(),

  // ドラッグ中の情報（種類によって構造が変わる）
  drag     : null,

  // 矢印描画中の情報
  drawing  : null,

  // グループ: groupId -> Set<selKey>
  groups   : new Map(),
  /*
   * drawing = {
   *   points     : {x,y}[]       — クリックで確定した点（先頭=始点）
   *   startSnap  : Endpoint|null — 始点のスナップ情報
   *   curMouse   : {x,y}         — 現在のマウス位置
   *   snapTarget : SnapTarget|null — 現在スナップ中のターゲット
   *   lastClick  : number        — 最後のクリック時刻（ms）
   * }
   */
};

// --- ヘルパー ---
function nextId() { return state.nextId++; }

/** Block を新規作成してstateに追加 */
function createBlock(x, y, w, h, text = 'コンポーネント', color = DEFAULT_BLOCK_COLOR) {
  const id = nextId();
  state.blocks.set(id, { id, x, y, w, h, text, color });
  return id;
}

/** Arrow を新規作成してstateに追加 */
function createArrow(start, end, waypoints = [], label = '', color = DEFAULT_ARROW_COLOR) {
  const id = nextId();
  state.arrows.set(id, { id, start, end, waypoints, label, color });
  return id;
}

/** Endpoint を生成（ブロック接続あり） */
function makeSnapEndpoint(blockId, side, t, x, y) {
  return { blockId, side, t, x, y };
}

/** Endpoint を生成（フリー） */
function makeFreeEndpoint(x, y) {
  return { blockId: null, side: null, t: null, x, y };
}

// --- 選択ヘルパー ---
function selKey(type, id)      { return `${type}-${id}`; }
function isSelected(type, id)  { return state.selections.has(selKey(type, id)); }
function getSelections()       { return [...state.selections.values()]; }

/** 単独選択（既存選択をクリアして1つを選ぶ） */
function setSelection(type, id) {
  state.selections.clear();
  state.selections.set(selKey(type, id), { type, id });
}

/** Ctrl+クリック用: 追加／除去トグル */
function toggleSelection(type, id) {
  const k = selKey(type, id);
  state.selections.has(k) ? state.selections.delete(k)
                          : state.selections.set(k, { type, id });
}

/** 選択を全解除 */
function clearSelection() { state.selections.clear(); }

// --- グループヘルパー ---

/** 要素が属するグループIDを返す（なければ null） */
function getGroupOf(type, id) {
  const k = selKey(type, id);
  for (const [gid, members] of state.groups) {
    if (members.has(k)) return gid;
  }
  return null;
}

/** グループの全メンバーを選択状態にする */
function selectGroup(groupId) {
  state.selections.clear();
  const members = state.groups.get(groupId);
  if (!members) return;
  for (const k of members) {
    const [type, idStr] = k.split('-');
    const id = Number(idStr);
    const exists = type === 'block' ? state.blocks.has(id) : state.arrows.has(id);
    if (exists) state.selections.set(k, { type, id });
  }
}

/** グループのブロック部材を包むバウンディングボックスを返す */
function groupBoundingBox(groupId) {
  const members = state.groups.get(groupId);
  if (!members) return null;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const k of members) {
    const [type, idStr] = k.split('-');
    if (type !== 'block') continue;
    const b = state.blocks.get(Number(idStr));
    if (!b) continue;
    minX = Math.min(minX, b.x); minY = Math.min(minY, b.y);
    maxX = Math.max(maxX, b.x + b.w); maxY = Math.max(maxY, b.y + b.h);
  }
  if (minX === Infinity) return null;
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}

/** 選択中要素をグループ化する */
function groupSelected() {
  if (state.selections.size < 2) {
    showStatus('グループ化には2つ以上の要素を選択してください');
    return;
  }
  pushHistory();
  const gid = nextId();
  const members = new Set();
  for (const { type, id } of getSelections()) {
    // 既存グループから除去
    const oldGid = getGroupOf(type, id);
    if (oldGid !== null) {
      const oldMembers = state.groups.get(oldGid);
      oldMembers.delete(selKey(type, id));
      if (oldMembers.size <= 1) state.groups.delete(oldGid);
    }
    members.add(selKey(type, id));
  }
  state.groups.set(gid, members);
  render();
  showStatus(`⊞ グループ化しました (${members.size}個)`);
}

/** 選択中グループを解除する */
function ungroupSelected() {
  const groupIds = new Set();
  for (const { type, id } of getSelections()) {
    const gid = getGroupOf(type, id);
    if (gid !== null) groupIds.add(gid);
  }
  if (groupIds.size === 0) { showStatus('選択中にグループがありません'); return; }
  pushHistory();
  for (const gid of groupIds) state.groups.delete(gid);
  render();
  showStatus('⊟ グループ解除しました');
}

/** 選択中の要素をすべて削除（ブロックに接続した矢印も一括削除） */
function deleteSelected() {
  if (state.selections.size === 0) return;
  pushHistory();
  const deletedKeys = new Set();
  for (const { type, id } of getSelections()) {
    deletedKeys.add(selKey(type, id));
    if (type === 'block') {
      state.blocks.delete(id);
      for (const [aid, arrow] of state.arrows) {
        if (arrow.start.blockId === id || arrow.end.blockId === id) {
          deletedKeys.add(selKey('arrow', aid));
          state.arrows.delete(aid);
        }
      }
    } else if (type === 'arrow') {
      state.arrows.delete(id);
    }
  }
  // 削除要素をグループから除去、メンバーが1個以下になったグループは解散
  for (const [gid, members] of state.groups) {
    for (const k of deletedKeys) members.delete(k);
    if (members.size <= 1) state.groups.delete(gid);
  }
  clearSelection();
}

/** 後方互換: 単一選択を返す（単独操作用） */
function getSingleSelection() {
  if (state.selections.size !== 1) return null;
  return [...state.selections.values()][0];
}

// --- シリアライズ / デシリアライズ ---
function serialize() {
  return JSON.stringify({
    version : 1,
    nextId  : state.nextId,
    blocks  : [...state.blocks.values()],
    arrows  : [...state.arrows.values()],
    groups  : [...state.groups.entries()].map(([gid, members]) => ({ gid, members: [...members] })),
  }, null, 2);
}

function deserialize(json) {
  const data = JSON.parse(json);
  state.blocks.clear();
  state.arrows.clear();
  state.groups.clear();
  (data.blocks || []).forEach(b => state.blocks.set(b.id, b));
  (data.arrows || []).forEach(a => state.arrows.set(a.id, a));
  (data.groups || []).forEach(({ gid, members }) => state.groups.set(gid, new Set(members)));
  state.nextId     = data.nextId ?? 1;
  state.selections.clear();
  state.drag       = null;
  state.drawing    = null;
}

// ============================================================
// ステップ3: ジオメトリ関数
// ============================================================

const SNAP_DIST   = 24;   // スナップ有効距離（px）
const HIT_ARROW   = 8;    // 矢印クリック判定の太さ（px）
const HANDLE_R    = 6;    // ハンドル半径（px）
const MIN_W       = 80;
const MIN_H       = 40;
const DEFAULT_W   = 140;
const DEFAULT_H   = 60;

// --- 基本 ---
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist2(ax, ay, bx, by) { return Math.hypot(bx - ax, by - ay); }

// --- ブロック周囲点 ---

/**
 * side + t からブロック辺上の絶対座標を返す
 * top   : t=0 → 左上,  t=1 → 右上
 * right : t=0 → 右上,  t=1 → 右下
 * bottom: t=0 → 右下,  t=1 → 左下
 * left  : t=0 → 左下,  t=1 → 左上
 */
function perimeterPoint(block, side, t) {
  const { x, y, w, h } = block;
  switch (side) {
    case 'top'   : return { x: x + t * w,       y: y           };
    case 'right' : return { x: x + w,            y: y + t * h   };
    case 'bottom': return { x: x + w - t * w,    y: y + h       };
    case 'left'  : return { x: x,                y: y + h - t * h };
  }
}

/**
 * 点 (px,py) に最も近いブロック辺上の点を返す
 * 戻り値: { side, t, x, y, dist }
 */
function nearestPerimeterPoint(block, px, py) {
  const { x, y, w, h } = block;

  // 各辺の最近傍点（辺上にクランプ）
  const candidates = [
    { side: 'top',    cx: clamp(px, x, x+w), cy: y           },
    { side: 'right',  cx: x+w,               cy: clamp(py, y, y+h) },
    { side: 'bottom', cx: clamp(px, x, x+w), cy: y+h         },
    { side: 'left',   cx: x,                 cy: clamp(py, y, y+h) },
  ];

  // t パラメータを計算
  candidates[0].t = w > 0 ? (candidates[0].cx - x) / w : 0;
  candidates[1].t = h > 0 ? (candidates[1].cy - y) / h : 0;
  candidates[2].t = w > 0 ? (x + w - candidates[2].cx) / w : 0;
  candidates[3].t = h > 0 ? (y + h - candidates[3].cy) / h : 0;

  let best = null, bestD = Infinity;
  for (const c of candidates) {
    const d = dist2(c.cx, c.cy, px, py);
    if (d < bestD) { bestD = d; best = c; }
  }
  return { side: best.side, t: best.t, x: best.cx, y: best.cy, dist: bestD };
}

/**
 * Endpoint の実座標を返す
 * ブロック接続の場合は現在のブロック位置から計算し直す
 */
function resolveEndpoint(ep) {
  if (ep.blockId != null) {
    const block = state.blocks.get(ep.blockId);
    if (block) return perimeterPoint(block, ep.side, ep.t);
  }
  return { x: ep.x, y: ep.y };
}

// --- 直角ルーティング ---

/**
 * 始点・終点とその辺情報から直角折れ線の中間ウェイポイントを自動計算する
 * 戻り値: [{x,y}] の配列（0〜2点）
 */
function computeOrthoWaypoints(startPt, startSide, endPt, endSide) {
  const sx = startPt.x, sy = startPt.y;
  const ex = endPt.x,   ey = endPt.y;
  const TOL = 3;

  const isH = s => s === 'left' || s === 'right';
  const isV = s => s === 'top'  || s === 'bottom';

  if (Math.abs(sx - ex) <= TOL && Math.abs(sy - ey) <= TOL) return [];

  if (isH(startSide) && isH(endSide)) {
    if (Math.abs(sy - ey) <= TOL) return [];          // 同一水平線
    const mx = (sx + ex) / 2;
    return [{x: mx, y: sy}, {x: mx, y: ey}];          // S字（垂直中継）
  }
  if (isV(startSide) && isV(endSide)) {
    if (Math.abs(sx - ex) <= TOL) return [];          // 同一垂直線
    const my = (sy + ey) / 2;
    return [{x: sx, y: my}, {x: ex, y: my}];          // S字（水平中継）
  }
  if (isH(startSide) && isV(endSide)) return [{x: ex, y: sy}]; // L字
  if (isV(startSide) && isH(endSide)) return [{x: sx, y: ey}]; // L字

  // フリー端点
  if (Math.abs(sy - ey) <= TOL) return [];
  if (Math.abs(sx - ex) <= TOL) return [];
  if (isH(startSide)) return [{x: ex, y: sy}];
  if (isV(startSide)) return [{x: sx, y: ey}];
  if (isH(endSide))   return [{x: sx, y: ey}];
  if (isV(endSide))   return [{x: ex, y: sy}];
  return [{x: ex, y: sy}]; // デフォルトL字
}

// --- 矢印ポイント列 ---

/**
 * 矢印の全座標列 [始点, ...中間点, 終点] を返す
 * waypoints が空の場合は computeOrthoWaypoints() で自動計算
 */
function arrowPoints(arrow) {
  const start = resolveEndpoint(arrow.start);
  const end   = resolveEndpoint(arrow.end);

  if (arrow.waypoints.length === 0) {
    const auto = computeOrthoWaypoints(
      start, arrow.start.side,
      end,   arrow.end.side
    );
    return [start, ...auto, end];
  }
  return [start, ...arrow.waypoints, end];
}

/** 矢印の中間点（ラベル位置）を返す */
function arrowMidpoint(arrow) {
  const pts = arrowPoints(arrow);
  let total = 0;
  const segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const d = dist2(pts[i].x, pts[i].y, pts[i+1].x, pts[i+1].y);
    segs.push(d);
    total += d;
  }
  let remain = total / 2;
  for (let i = 0; i < segs.length; i++) {
    if (remain <= segs[i] + 1e-9) {
      const t = segs[i] > 0 ? remain / segs[i] : 0;
      return {
        x: pts[i].x + t * (pts[i+1].x - pts[i].x),
        y: pts[i].y + t * (pts[i+1].y - pts[i].y),
      };
    }
    remain -= segs[i];
  }
  return pts[Math.floor(pts.length / 2)];
}

// --- ヒットテスト ---

/** 点が矩形の内側かどうか */
function pointInBlock(block, px, py) {
  return px >= block.x && px <= block.x + block.w
      && py >= block.y && py <= block.y + block.h;
}

/** 点が線分の近傍かどうか */
function pointNearSegment(px, py, x1, y1, x2, y2, threshold) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx*dx + dy*dy;
  if (len2 === 0) return dist2(px, py, x1, y1) <= threshold;
  const t = clamp(((px-x1)*dx + (py-y1)*dy) / len2, 0, 1);
  return dist2(px, py, x1 + t*dx, y1 + t*dy) <= threshold;
}

/** 点が矢印ライン上にあるか */
function pointOnArrow(arrow, px, py) {
  const pts = arrowPoints(arrow);
  for (let i = 0; i < pts.length - 1; i++) {
    if (pointNearSegment(px, py, pts[i].x, pts[i].y,
                                 pts[i+1].x, pts[i+1].y, HIT_ARROW)) return true;
  }
  return false;
}

/**
 * (px,py) でヒットした要素を返す
 * 優先順: ブロック > 矢印
 * 戻り値: { type:'block'|'arrow', id } | null
 */
function hitTest(px, py) {
  // ブロックは後から追加されたものが手前 → Mapの末尾から検索
  const blocks = [...state.blocks.values()];
  for (let i = blocks.length - 1; i >= 0; i--) {
    if (pointInBlock(blocks[i], px, py)) return { type: 'block', id: blocks[i].id };
  }
  const arrows = [...state.arrows.values()];
  for (let i = arrows.length - 1; i >= 0; i--) {
    if (pointOnArrow(arrows[i], px, py)) return { type: 'arrow', id: arrows[i].id };
  }
  return null;
}

// --- スナップ検出 ---

/**
 * (px,py) に近いブロック辺のスナップ点を探す
 * excludeId: 除外するブロックID（矢印始点のブロックなど）
 * 戻り値: { blockId, side, t, x, y } | null
 */
function findSnap(px, py, excludeId = null) {
  let best = null, bestD = SNAP_DIST;
  for (const block of state.blocks.values()) {
    if (block.id === excludeId) continue;
    const p = nearestPerimeterPoint(block, px, py);
    if (p.dist < bestD) {
      bestD = p.dist;
      best = { blockId: block.id, side: p.side, t: p.t, x: p.x, y: p.y };
    }
  }
  return best;
}

// --- リサイズハンドル ---

/**
 * 選択中ブロックのリサイズハンドル一覧を返す
 * 各ハンドル: { x, y, dir }
 * dir は 'n'|'ne'|'e'|'se'|'s'|'sw'|'w'|'nw' (compass 方向)
 */
function resizeHandles(block) {
  const { x, y, w, h } = block;
  return [
    { x: x+w/2, y: y,     dir: 'n'  },
    { x: x+w,   y: y,     dir: 'ne' },
    { x: x+w,   y: y+h/2, dir: 'e'  },
    { x: x+w,   y: y+h,   dir: 'se' },
    { x: x+w/2, y: y+h,   dir: 's'  },
    { x: x,     y: y+h,   dir: 'sw' },
    { x: x,     y: y+h/2, dir: 'w'  },
    { x: x,     y: y,     dir: 'nw' },
  ];
}

/** (px,py) に近いリサイズハンドルを返す（なければ null） */
function hitResizeHandle(block, px, py) {
  for (const h of resizeHandles(block)) {
    if (dist2(px, py, h.x, h.y) <= HANDLE_R + 2) return h;
  }
  return null;
}

/** (px,py) に近いウェイポイントハンドルを返す（なければ null） */
function hitWaypointHandle(arrow, px, py) {
  for (let i = 0; i < arrow.waypoints.length; i++) {
    const wp = arrow.waypoints[i];
    if (dist2(px, py, wp.x, wp.y) <= HANDLE_R + 2) return i;
  }
  return null;
}

/**
 * 選択中矢印のセグメントへのヒット（端点・ウェイポイントハンドル近傍は除外）
 * 戻り値: { segIdx, orientation:'H'|'V' } | null
 */
function hitArrowSegment(arrow, px, py) {
  const pts = arrowPoints(arrow);
  const n   = pts.length;

  // 端点ハンドルに近い場合は除外（端点ドラッグが優先）
  if (dist2(px, py, pts[0].x,   pts[0].y)   <= HANDLE_R + 4) return null;
  if (dist2(px, py, pts[n-1].x, pts[n-1].y) <= HANDLE_R + 4) return null;
  // ウェイポイントハンドルに近い場合も除外
  for (const wp of arrow.waypoints) {
    if (dist2(px, py, wp.x, wp.y) <= HANDLE_R + 2) return null;
  }

  for (let i = 0; i < n - 1; i++) {
    if (!pointNearSegment(px, py, pts[i].x, pts[i].y, pts[i+1].x, pts[i+1].y, HIT_ARROW)) continue;
    const dx = Math.abs(pts[i+1].x - pts[i].x);
    const dy = Math.abs(pts[i+1].y - pts[i].y);
    const orientation = dy <= dx * 0.3 + 1 ? 'H' : 'V';
    return { segIdx: i, orientation };
  }
  return null;
}

/** 端点ハンドルへのヒット: 'start' | 'end' | null */
function hitEndpointHandle(arrow, px, py) {
  const pts = arrowPoints(arrow);
  const sp  = pts[0];
  const ep  = pts[pts.length - 1];
  if (dist2(px, py, sp.x, sp.y) <= HANDLE_R + 4) return 'start';
  if (dist2(px, py, ep.x, ep.y) <= HANDLE_R + 4) return 'end';
  return null;
}

// --- SVG座標取得 ---
const svgEl = document.getElementById('canvas');
function svgPoint(e) {
  const r = svgEl.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

// ============================================================
// ステップ4: ブロック描画
// ============================================================

const layerGroups  = document.getElementById('layer-groups');
const layerBlocks  = document.getElementById('layer-blocks');
const layerArrows  = document.getElementById('layer-arrows');
const layerOverlay = document.getElementById('layer-overlay');

/** SVG名前空間付きで要素を作成し、attrs をセットして parent に追加 */
function mkEl(tag, attrs = {}, parent = null) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  if (parent) parent.appendChild(el);
  return el;
}

/** テキストを複数行で SVG に描画する（<tspan> で折り返し） */
function renderBlockText(g, block) {
  const lines  = block.text.split('\n');
  const lh     = 18;
  const cx     = block.x + block.w / 2;
  const totalH = lines.length * lh;
  const startY = block.y + block.h / 2 - totalH / 2 + lh / 2;

  const txt = mkEl('text', {
    'font-size'  : '13',
    'font-family': 'Segoe UI, Yu Gothic UI, sans-serif',
    'text-anchor': 'middle',
    fill         : '#e2e8f0',
    'pointer-events': 'none',
    'user-select'   : 'none',
  }, g);

  lines.forEach((line, i) => {
    const ts = mkEl('tspan', { x: cx, y: startY + i * lh }, txt);
    ts.textContent = line;
  });
}

/** ブロック1つを SVG で描画する */
function renderBlock(block) {
  const sel = isSelected('block', block.id);
  const { x, y, w, h } = block;

  const g = mkEl('g', { 'data-bid': block.id }, layerBlocks);

  const color = block.color || DEFAULT_BLOCK_COLOR;

  // --- ドロップシャドウ ---
  mkEl('rect', {
    x: x + 3, y: y + 4, width: w, height: h,
    fill: 'rgba(0,0,0,0.35)',
  }, g);

  // --- 本体（角なし） ---
  mkEl('rect', {
    x, y, width: w, height: h,
    fill          : sel ? color + '40' : color + '22',
    stroke        : color,
    'stroke-width': sel ? 2.5 : 1.5,
  }, g);

  // --- テキスト ---
  renderBlockText(g, block);

  // --- 選択中: リサイズハンドル ---
  if (sel) {
    for (const h of resizeHandles(block)) {
      mkEl('rect', {
        x: h.x - HANDLE_R, y: h.y - HANDLE_R,
        width: HANDLE_R * 2, height: HANDLE_R * 2,
        rx: 2, ry: 2,
        fill  : '#63b3ed',
        stroke: '#2d3748',
        'stroke-width': 1,
        'data-dir': h.dir,
        cursor: dirToCursor(h.dir),
      }, layerOverlay);
    }
  }
}

/** compass方向 → CSS cursor */
function dirToCursor(dir) {
  const map = {
    n: 'n-resize', ne: 'ne-resize', e: 'e-resize', se: 'se-resize',
    s: 's-resize', sw: 'sw-resize', w: 'w-resize', nw: 'nw-resize',
  };
  return map[dir] ?? 'default';
}

/** 全ブロックを再描画（layerBlocks + layerOverlay はクリアして再構築） */
function renderAllBlocks() {
  layerBlocks.innerHTML  = '';
  // overlayはarrow描画後にまとめてクリアするので、ここでは触らない
  for (const block of state.blocks.values()) renderBlock(block);
}

// --- ツール切り替え ---
function setTool(name) {
  state.tool    = name;
  state.drawing = null;
  ['select','block','arrow'].forEach(t => {
    document.getElementById('btn-' + t).classList.toggle('active', t === name);
  });
  svgEl.style.cursor = name === 'select' ? 'default' : 'crosshair';
  render();
}

document.getElementById('btn-select').addEventListener('click', () => setTool('select'));
document.getElementById('btn-block' ).addEventListener('click', () => setTool('block'));
document.getElementById('btn-arrow' ).addEventListener('click', () => setTool('arrow'));
document.getElementById('btn-delete') .addEventListener('click', () => { deleteSelected(); render(); });
document.getElementById('btn-group')  .addEventListener('click', groupSelected);
document.getElementById('btn-ungroup').addEventListener('click', ungroupSelected);

// --- マウス状態 ---
let isDown    = false;
let downPos   = { x: 0, y: 0 };  // mousedown 時の座標

// --- mousedown ---
svgEl.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  e.preventDefault();
  isDown  = true;
  downPos = svgPoint(e);
  const { x, y } = downPos;

  hideCtxMenu();

  if (state.tool === 'select') onSelectDown(x, y, e.ctrlKey || e.metaKey);
  if (state.tool === 'block')  onBlockDown(x, y);
  // arrow は mousedown ではなく click で処理（ステップ7）
});

// --- mousemove ---
svgEl.addEventListener('mousemove', e => {
  const { x, y } = svgPoint(e);
  if (!isDown) return;
  onDragMove(x, y);
});

// --- mouseup: SVG外でボタンを離しても確実にドラッグ終了させる ---
document.addEventListener('mouseup', e => {
  if (e.button !== 0 || !isDown) return;
  isDown = false;
  const hadDrag = !!state.drag;
  const r = svgEl.getBoundingClientRect();
  const x = e.clientX - r.left;
  const y = e.clientY - r.top;
  if (hadDrag) pushHistory();
  onDragEnd(x, y);
});

// ============================================================
// 選択ツール: mousedown
// ============================================================
function onSelectDown(x, y, ctrlKey) {
  // 1. 単独選択中ブロックのリサイズハンドル（Ctrl非押下かつ単独選択時のみ）
  if (!ctrlKey) {
    const single = getSingleSelection();
    if (single?.type === 'block') {
      const block = state.blocks.get(single.id);
      if (block) {
        const h = hitResizeHandle(block, x, y);
        if (h) {
          state.drag = {
            type: 'resize', id: block.id, dir: h.dir,
            ox: block.x, oy: block.y, ow: block.w, oh: block.h, mx: x, my: y,
          };
          return;
        }
      }
    }

    // 2. 単独選択中矢印のハンドル（端点 → ウェイポイント → セグメント）
    if (single?.type === 'arrow') {
      const arrow = state.arrows.get(single.id);
      if (arrow) {
        const which = hitEndpointHandle(arrow, x, y);
        if (which !== null) {
          state.drag = { type: 'ep-move', id: arrow.id, which, snap: null };
          return;
        }
        const wpi = hitWaypointHandle(arrow, x, y);
        if (wpi !== null) {
          state.drag = { type: 'wp-move', id: arrow.id, idx: wpi };
          return;
        }
        const segHit = hitArrowSegment(arrow, x, y);
        if (segHit !== null) {
          if (arrow.waypoints.length === 0) {
            arrow.waypoints = arrowPoints(arrow).slice(1, -1).map(p => ({x: p.x, y: p.y}));
          }
          state.drag = {
            type: 'seg-move', id: arrow.id,
            segIdx: segHit.segIdx, orientation: segHit.orientation,
            startX: x, startY: y,
            origWaypoints: arrow.waypoints.map(p => ({...p})),
            nPts: arrow.waypoints.length + 2,
          };
          return;
        }
      }
    }
  }

  // 3. ヒットテスト
  const hit = hitTest(x, y);
  if (hit) {
    if (ctrlKey) {
      // Ctrl+クリック: 追加/除去トグル
      toggleSelection(hit.type, hit.id);
      render();
      return;
    }
    // グループ要素なら全メンバーを選択
    const groupId = getGroupOf(hit.type, hit.id);
    if (groupId !== null && !isSelected(hit.type, hit.id)) {
      selectGroup(groupId);
    } else if (!isSelected(hit.type, hit.id)) {
      setSelection(hit.type, hit.id);
    }

    if (hit.type === 'block') {
      // 選択されているブロック全部の元座標を記録
      const blocksOrig = getSelections()
        .filter(s => s.type === 'block')
        .map(s => { const b = state.blocks.get(s.id); return b ? {id: s.id, ox: b.x, oy: b.y} : null; })
        .filter(Boolean);
      state.drag = { type: 'move-multi', blocksOrig, mx: x, my: y };
    }
    render();
  } else {
    clearSelection();
    render();
  }
}

// ============================================================
// ブロックツール: mousedown → ドラッグで新規作成
// ============================================================
function onBlockDown(x, y) {
  state.drag = { type: 'create', sx: x, sy: y, cx: x, cy: y };
  render();
}

// ============================================================
// ドラッグ中
// ============================================================
function onDragMove(x, y) {
  const d = state.drag;
  if (!d) return;

  if (d.type === 'move-multi') {
    const dx = x - d.mx, dy = y - d.my;
    for (const {id, ox, oy} of d.blocksOrig) {
      const b = state.blocks.get(id);
      if (b) { b.x = ox + dx; b.y = oy + dy; }
    }
    render();

  } else if (d.type === 'resize') {
    applyResize(d, x, y);
    render();

  } else if (d.type === 'create') {
    d.cx = x; d.cy = y;
    render();

  } else if (d.type === 'wp-move') {
    const arrow = state.arrows.get(d.id);
    if (arrow) { arrow.waypoints[d.idx] = { x, y }; render(); }

  } else if (d.type === 'seg-move') {
    const arrow = state.arrows.get(d.id);
    if (!arrow) return;
    const dx = x - d.startX;
    const dy = y - d.startY;
    const i  = d.segIdx;
    const n  = d.nPts;  // start + waypoints + end の総点数

    // origWaypoints から毎フレーム再計算（相対移動）
    arrow.waypoints = d.origWaypoints.map(p => ({...p}));

    if (d.orientation === 'H') {
      // 水平セグメントを上下に動かす → 両端ウェイポイントのY座標を変更
      // pts[i]   = waypoints[i-1] (i > 0 のとき)
      // pts[i+1] = waypoints[i]   (i < n-1 のとき)
      if (i > 0   && i-1 < arrow.waypoints.length) arrow.waypoints[i-1].y += dy;
      if (i < n-2 && i   < arrow.waypoints.length) arrow.waypoints[i].y   += dy;
    } else {
      // 垂直セグメントを左右に動かす → 両端ウェイポイントのX座標を変更
      if (i > 0   && i-1 < arrow.waypoints.length) arrow.waypoints[i-1].x += dx;
      if (i < n-2 && i   < arrow.waypoints.length) arrow.waypoints[i].x   += dx;
    }
    render();

  } else if (d.type === 'ep-move') {
    const arrow = state.arrows.get(d.id);
    if (!arrow) return;
    // スナップ検索（反対側の端点が接続しているブロックも候補に含める）
    d.snap = findSnap(x, y);
    // 端点をマウス位置に仮更新（リアルタイムプレビュー）
    const ep = d.snap
      ? makeSnapEndpoint(d.snap.blockId, d.snap.side, d.snap.t, d.snap.x, d.snap.y)
      : makeFreeEndpoint(x, y);
    arrow[d.which] = ep;
    render();
  }
}

/** リサイズ計算: dir に応じて x/y/w/h を更新 */
function applyResize(d, mx, my) {
  const b  = state.blocks.get(d.id);
  if (!b) return;
  const dx = mx - d.mx;
  const dy = my - d.my;

  let { ox, oy, ow, oh } = d;
  let nx = ox, ny = oy, nw = ow, nh = oh;

  if (d.dir.includes('e')) { nw = Math.max(MIN_W, ow + dx); }
  if (d.dir.includes('s')) { nh = Math.max(MIN_H, oh + dy); }
  if (d.dir.includes('w')) {
    nw = Math.max(MIN_W, ow - dx);
    nx = ox + ow - nw;
  }
  if (d.dir.includes('n')) {
    nh = Math.max(MIN_H, oh - dy);
    ny = oy + oh - nh;
  }

  b.x = nx; b.y = ny; b.w = nw; b.h = nh;
}

// ============================================================
// ドラッグ終了
// ============================================================
function onDragEnd(x, y) {
  const d = state.drag;
  state.drag = null;

  if (!d) return;

  if (d.type === 'create') {
    // ドラッグ範囲からブロックを作成
    const bx = Math.min(d.sx, x);
    const by = Math.min(d.sy, y);
    const bw = Math.max(MIN_W, Math.abs(x - d.sx));
    const bh = Math.max(MIN_H, Math.abs(y - d.sy));
    const id = createBlock(bx, by, bw, bh, 'コンポーネント');
    setSelection('block', id);
    setTool('select');
    render();
    // 作成直後にテキスト編集を開始
    requestAnimationFrame(() => openEditor('block', id));
  }
}

// ============================================================
// renderOverlay: ブロック作成プレビュー矩形
// ============================================================
function renderOverlay() {
  const d = state.drag;
  if (d?.type === 'create') {
    const bx = Math.min(d.sx, d.cx);
    const by = Math.min(d.sy, d.cy);
    const bw = Math.max(MIN_W, Math.abs(d.cx - d.sx));
    const bh = Math.max(MIN_H, Math.abs(d.cy - d.sy));
    mkEl('rect', {
      x: bx, y: by, width: bw, height: bh,
      rx: 7, ry: 7,
      fill           : 'rgba(66,153,225,0.12)',
      stroke         : '#4299e1',
      'stroke-width' : 2,
      'stroke-dasharray': '6 3',
      'pointer-events'  : 'none',
    }, layerOverlay);
  }
  // 矢印オーバーレイはステップ7以降
}

// ============================================================
// キーボードショートカット
// ============================================================
document.addEventListener('keydown', e => {
  if (document.getElementById('text-editor').style.display !== 'none') return;
  switch (e.key) {
    case 'v': case 'V': setTool('select'); break;
    case 'b': case 'B': setTool('block');  break;
    case 'a': case 'A': setTool('arrow');  break;
    case 'g': case 'G':
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        e.shiftKey ? ungroupSelected() : groupSelected();
      }
      break;
    case 'Delete': case 'Backspace':
      e.preventDefault();
      deleteSelected(); render();
      break;
    case 'Escape':
      if (state.drawing) { state.drawing = null; setTool('select'); }
      else { clearSelection(); render(); }
      break;
  }
});

// ステップ6: 矢印描画
// ============================================================

/**
 * 矢印1本を layerArrows に描画する
 * ・ポリライン（始点→中間折れ点→終点）
 * ・終点に矢印ヘッド
 * ・ラベル（矢印中間点の上）
 * ・選択中: ウェイポイントハンドル + セグメント中点ハンドル
 */
function renderArrow(arrow) {
  const sel = isSelected('arrow', arrow.id);
  const pts = arrowPoints(arrow);
  if (pts.length < 2) return;

  const baseColor  = arrow.color || DEFAULT_ARROW_COLOR;
  // 選択中は明るくする（白に20%寄せる）
  const color      = sel ? baseColor : baseColor + 'cc';
  const strokeW    = sel ? 2.5 : 2;

  // --- パス文字列生成 ---
  const d = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');

  // --- ヒット用透明太線（クリックしやすくする） ---
  mkEl('path', {
    d,
    stroke         : 'transparent',
    'stroke-width' : 14,
    fill           : 'none',
    'data-aid'     : arrow.id,
    cursor         : 'pointer',
  }, layerArrows);

  // --- 見た目の線（色別マーカーIDで矢印ヘッドを描画） ---
  const markerId = createArrowMarker(baseColor);
  mkEl('path', {
    d,
    stroke          : baseColor,
    'stroke-width'  : strokeW,
    fill            : 'none',
    'marker-end'    : `url(#${markerId})`,
    'pointer-events': 'none',
    opacity         : sel ? '1' : '0.85',
  }, layerArrows);

  // --- ラベル ---
  if (arrow.label) {
    const mid    = arrowMidpoint(arrow);
    const labelW = Math.max(40, arrow.label.length * 8 + 12);
    const lx     = mid.x - labelW / 2;
    const ly     = mid.y - 22;

    // 背景
    mkEl('rect', {
      x: lx, y: ly, width: labelW, height: 17,
      rx: 3, ry: 3,
      fill   : '#1e2533',
      opacity: '0.85',
      'pointer-events': 'none',
    }, layerArrows);

    // テキスト
    const lt = mkEl('text', {
      x              : mid.x,
      y              : ly + 12,
      'text-anchor'  : 'middle',
      'font-size'    : '12',
      'font-family'  : 'Segoe UI, Yu Gothic UI, sans-serif',
      fill           : baseColor,
      'pointer-events': 'none',
    }, layerArrows);
    lt.textContent = arrow.label;
  }

  // --- 選択中: ハンドル類 ---
  if (sel) {
    // 端点ハンドル（始点・終点をドラッグで移動・再接続）
    const sp  = pts[0];
    const ep2 = pts[pts.length - 1];
    [['start', sp], ['end', ep2]].forEach(([which, pt]) => {
      const dragging = state.drag?.type === 'ep-move' && state.drag.which === which;
      mkEl('circle', {
        cx: pt.x, cy: pt.y, r: HANDLE_R + 2,
        fill          : dragging ? '#4299e1' : '#1a202c',
        stroke        : '#f6ad55',
        'stroke-width': 2,
        cursor        : 'move',
        'data-ep'     : which,
        'data-aid'    : arrow.id,
      }, layerOverlay);
    });

    // ウェイポイントハンドル（ドラッグで折れ点移動）
    arrow.waypoints.forEach((wp, i) => {
      mkEl('circle', {
        cx: wp.x, cy: wp.y, r: HANDLE_R,
        fill: '#2d3748', stroke: '#63b3ed', 'stroke-width': 1.5,
        cursor: 'move', 'data-wp': i, 'data-aid': arrow.id,
      }, layerOverlay);
    });

    // セグメント中点: ドラッグ方向を示すインジケータ
    for (let i = 0; i < pts.length - 1; i++) {
      const mx  = (pts[i].x + pts[i+1].x) / 2;
      const my  = (pts[i].y + pts[i+1].y) / 2;
      const dx  = Math.abs(pts[i+1].x - pts[i].x);
      const dy2 = Math.abs(pts[i+1].y - pts[i].y);
      const isH = dy2 <= dx * 0.3 + 1;
      const cur = isH ? 'ns-resize' : 'ew-resize';
      // 短いセグメントはスキップ
      const len = dist2(pts[i].x, pts[i].y, pts[i+1].x, pts[i+1].y);
      if (len < 20) continue;
      // 細長い矩形でドラッグ方向を示す
      const rw = isH ? 10 : 4;
      const rh = isH ? 4  : 10;
      mkEl('rect', {
        x: mx - rw/2, y: my - rh/2, width: rw, height: rh,
        rx: 2,
        fill: '#4299e1', opacity: '0.7',
        cursor: cur,
        'data-seg': i, 'data-aid': arrow.id,
      }, layerOverlay);
    }
  }
}

/** グループの外枠（破線矩形）を layer-groups に描画 */
function renderGroups() {
  layerGroups.innerHTML = '';
  const PAD = 12;
  for (const [gid, members] of state.groups) {
    const bb = groupBoundingBox(gid);
    if (!bb) continue;
    mkEl('rect', {
      x: bb.x - PAD, y: bb.y - PAD,
      width: bb.w + PAD * 2, height: bb.h + PAD * 2,
      fill: 'none',
      stroke: '#4299e1',
      'stroke-width': 1.5,
      'stroke-dasharray': '8 4',
      opacity: '0.45',
      rx: 5,
      'pointer-events': 'none',
    }, layerGroups);
  }
}

/** render() に矢印描画を組み込む（ステップ4のrenderを上書き） */
function render() {
  layerBlocks.innerHTML  = '';
  layerArrows.innerHTML  = '';
  layerOverlay.innerHTML = '';

  // グループ外枠
  renderGroups();

  // 矢印（ブロックの下に描画）
  for (const arrow of state.arrows.values()) renderArrow(arrow);

  // ブロック（矢印の上に描画）
  for (const block of state.blocks.values()) renderBlock(block);

  // オーバーレイ（ハンドル・プレビュー）
  renderOverlay();
  // カラーピッカーの表示更新
  if (typeof updateColorPicker === 'function') updateColorPicker();
}

// ============================================================
// ステップ7: 矢印の接続スナップ（PowerPoint方式）
// ============================================================

// --- mousemove: 矢印ツール中のスナップ更新 ---
svgEl.addEventListener('mousemove', e => {
  const { x, y } = svgPoint(e);

  if (state.tool === 'arrow') {
    if (state.drawing) {
      // 始点ブロックは除外してスナップ検索
      const excl = state.drawing.startSnap?.blockId ?? null;
      state.drawing.snap    = findSnap(x, y, excl);
      state.drawing.curMouse = { x, y };
      render();
    } else {
      // 未開始: ホバー中のスナップ候補だけ表示
      state._hoverSnap = findSnap(x, y);
      render();
    }
  } else {
    state._hoverSnap = null;
  }
}, true); // capture: mousemoveが先に来るよう capture フェーズで登録

// --- click: 矢印ツールのシングルクリック処理 ---
// (dblclick と競合するため時間差で確定)
let _arrowClickTimer = null;

svgEl.addEventListener('click', e => {
  if (state.tool !== 'arrow') return;
  e.stopPropagation();

  const { x, y } = svgPoint(e);

  if (!state.drawing) {
    // ===== 矢印描画開始 =====
    const snap = findSnap(x, y);
    const startPt = snap ? { x: snap.x, y: snap.y } : { x, y };
    state.drawing = {
      points    : [startPt],          // 確定済み点列（始点含む）
      startSnap : snap                // 始点スナップ情報
        ? makeSnapEndpoint(snap.blockId, snap.side, snap.t, snap.x, snap.y)
        : null,
      curMouse  : startPt,
      snap      : null,
    };
    state._hoverSnap = null;
    render();
    showStatus('クリックで折れ点追加 / ブロック辺でクリックで接続 / ダブルクリックで終了');
    return;
  }

  // ===== 矢印描画中 =====
  // ダブルクリック(dblclick)と競合するため 220ms 遅延確定
  const snapNow = state.drawing.snap;
  const ptNow   = snapNow ? { x: snapNow.x, y: snapNow.y } : { x, y };

  clearTimeout(_arrowClickTimer);
  _arrowClickTimer = setTimeout(() => {
    _arrowClickTimer = null;
    if (!state.drawing) return;

    if (snapNow) {
      // ブロック辺にスナップ → 矢印を完成させる
      finishArrow(snapNow);
    } else {
      // 空白クリック → 折れ点を追加
      state.drawing.points.push(ptNow);
      render();
    }
  }, 220);
});

// --- dblclick: 矢印ツール中 → フリー終点確定 / 選択ツール中 → テキスト編集 ---
svgEl.addEventListener('dblclick', e => {
  const { x, y } = svgPoint(e);

  // 矢印描画中のダブルクリック → 確定
  if (state.tool === 'arrow' && state.drawing) {
    e.stopPropagation();
    clearTimeout(_arrowClickTimer);
    _arrowClickTimer = null;
    const snap = state.drawing.snap;
    snap ? finishArrow(snap) : finishArrow(null, { x, y });
    return;
  }

  // 選択ツール: 矢印上でダブルクリック → ウェイポイントをリセット（自動ルートに戻す）
  const _dblSel = getSingleSelection();
  if (state.tool === 'select' && _dblSel?.type === 'arrow') {
    const arrow = state.arrows.get(_dblSel.id);
    if (arrow) {
      // ウェイポイントハンドル上 → 1点削除
      const wpi = hitWaypointHandle(arrow, x, y);
      if (wpi !== null) {
        pushHistory();
        arrow.waypoints.splice(wpi, 1);
        render();
        showStatus('折れ点を削除しました');
        return;
      }
      // セグメント上 → 全ウェイポイントをリセットして自動ルートに戻す
      const segHit = hitArrowSegment(arrow, x, y);
      if (segHit !== null && arrow.waypoints.length > 0) {
        pushHistory();
        arrow.waypoints = [];
        render();
        showStatus('自動ルートに戻しました（ダブルクリック）');
        return;
      }
    }
  }
});

/** 矢印を確定して state.arrows に追加する */
function finishArrow(endSnap, freePt = null) {
  pushHistory();
  const d = state.drawing;
  state.drawing = null;

  // 始点
  const start = d.startSnap ?? makeFreeEndpoint(d.points[0].x, d.points[0].y);

  // 終点
  const end = endSnap
    ? makeSnapEndpoint(endSnap.blockId, endSnap.side, endSnap.t, endSnap.x, endSnap.y)
    : makeFreeEndpoint(freePt.x, freePt.y);

  // 中間折れ点（始点の次から）
  const waypoints = d.points.slice(1);

  const id = createArrow(start, end, waypoints, '');
  setSelection('arrow', id);
  setTool('select');
  render();
  showStatus('矢印を作成しました。ダブルクリックでラベル編集');
}

// ============================================================
// renderOverlay 拡張: スナップ表示 + 矢印プレビュー
// ============================================================
function renderOverlay() {
  // --- ブロック作成プレビュー ---
  const d = state.drag;
  if (d?.type === 'create') {
    const bx = Math.min(d.sx, d.cx);
    const by = Math.min(d.sy, d.cy);
    const bw = Math.max(MIN_W, Math.abs(d.cx - d.sx));
    const bh = Math.max(MIN_H, Math.abs(d.cy - d.sy));
    mkEl('rect', {
      x: bx, y: by, width: bw, height: bh,
      rx: 7, ry: 7,
      fill: 'rgba(66,153,225,0.1)', stroke: '#4299e1',
      'stroke-width': 2, 'stroke-dasharray': '6 3',
      'pointer-events': 'none',
    }, layerOverlay);
  }

  // --- 矢印ツール: ホバースナップ表示（未開始） ---
  const hs = state._hoverSnap;
  if (state.tool === 'arrow' && !state.drawing && hs) {
    renderSnapIndicator(hs.x, hs.y);
  }

  // --- 端点ドラッグ中のスナップインジケータ ---
  if (state.drag?.type === 'ep-move' && state.drag.snap) {
    renderSnapIndicator(state.drag.snap.x, state.drag.snap.y);
  }

  // --- 矢印描画中プレビュー ---
  if (state.drawing) {
    const dr  = state.drawing;
    const cur = dr.snap ? { x: dr.snap.x, y: dr.snap.y } : dr.curMouse;
    const pts = [...dr.points, cur];

    // 破線プレビュー
    const dStr = pts.map((p, i) =>
      `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`
    ).join(' ');
    mkEl('path', {
      d: dStr,
      stroke: '#4299e1', 'stroke-width': 2,
      'stroke-dasharray': '7 4',
      fill: 'none', 'pointer-events': 'none',
    }, layerOverlay);

    // 始点マーカー
    const sp = dr.points[0];
    mkEl('circle', { cx: sp.x, cy: sp.y, r: 5,
      fill: '#4299e1', 'pointer-events': 'none' }, layerOverlay);

    // 確定済み中間折れ点
    dr.points.slice(1).forEach(p => {
      mkEl('circle', { cx: p.x, cy: p.y, r: 4,
        fill: '#2d3748', stroke: '#4299e1', 'stroke-width': 1.5,
        'pointer-events': 'none' }, layerOverlay);
    });

    // スナップ先インジケータ
    if (dr.snap) renderSnapIndicator(dr.snap.x, dr.snap.y);
  }
}

/** スナップ点に青いリングを描画 */
function renderSnapIndicator(x, y) {
  mkEl('circle', { cx: x, cy: y, r: 9,
    fill: 'none', stroke: '#4299e1', 'stroke-width': 2,
    opacity: '0.9', 'pointer-events': 'none' }, layerOverlay);
  mkEl('circle', { cx: x, cy: y, r: 3,
    fill: '#4299e1', 'pointer-events': 'none' }, layerOverlay);
}


// ============================================================
// ステップ9: テキスト編集・矢印ラベル
// ============================================================

const textEditor = document.getElementById('text-editor');
let _editing = null; // { type:'block'|'arrow', id }

/** テキストエディタを開く */
function openEditor(type, id) {
  if (_editing) closeEditor(false); // 前の編集を確定して閉じる

  const svgRect = svgEl.getBoundingClientRect();

  if (type === 'block') {
    const b = state.blocks.get(id);
    if (!b) return;

    _editing = { type, id };
    textEditor.value = b.text;

    // ブロックと同じ位置・サイズに配置
    textEditor.style.left      = (svgRect.left + b.x) + 'px';
    textEditor.style.top       = (svgRect.top  + b.y) + 'px';
    textEditor.style.width     = b.w + 'px';
    textEditor.style.height    = b.h + 'px';
    textEditor.style.fontSize  = '13px';
    textEditor.style.textAlign = 'center';
    // 縦中央揃えは padding-top で近似
    textEditor.style.paddingTop = Math.max(4, (b.h - 22) / 2) + 'px';

  } else if (type === 'arrow') {
    const arrow = state.arrows.get(id);
    if (!arrow) return;

    _editing = { type, id };
    const mid = arrowMidpoint(arrow);

    textEditor.value = arrow.label ?? '';
    textEditor.style.width     = '140px';
    textEditor.style.height    = '28px';
    textEditor.style.fontSize  = '12px';
    textEditor.style.textAlign = 'center';
    textEditor.style.paddingTop = '4px';
    // 中間点の上に配置
    textEditor.style.left = (svgRect.left + mid.x - 70) + 'px';
    textEditor.style.top  = (svgRect.top  + mid.y - 36) + 'px';
  }

  textEditor.style.display = 'block';
  // 次フレームでフォーカス（レイアウト確定後）
  requestAnimationFrame(() => { textEditor.focus(); textEditor.select(); });
}

/** テキストエディタを閉じる（confirm=true で値を反映） */
function closeEditor(confirm = true) {
  if (!_editing) return;
  if (confirm) pushHistory();
  const { type, id } = _editing;
  _editing = null;
  textEditor.style.display = 'none';

  if (!confirm) return;

  if (type === 'block') {
    const b = state.blocks.get(id);
    if (b) b.text = textEditor.value || 'コンポーネント';
  } else if (type === 'arrow') {
    const arrow = state.arrows.get(id);
    if (arrow) arrow.label = textEditor.value;
  }
  render();
}

// --- テキストエディタのイベント ---
textEditor.addEventListener('blur', () => closeEditor(true));

textEditor.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    e.preventDefault();
    closeEditor(false);
    render();
    return;
  }
  // ブロック編集: Shift+Enter で改行、Enter だけは確定
  if (_editing?.type === 'block') {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      closeEditor(true);
    }
  } else {
    // 矢印ラベル: Enter で確定
    if (e.key === 'Enter') {
      e.preventDefault();
      closeEditor(true);
    }
  }
  // 自動リサイズ（高さをコンテンツに合わせる）
  requestAnimationFrame(() => {
    if (_editing?.type === 'block') return; // ブロックはサイズ固定
    textEditor.style.height = 'auto';
    textEditor.style.height = textEditor.scrollHeight + 'px';
  });
});

// --- dblclick 拡張: ブロック/矢印のテキスト編集を開く ---
// （ステップ8の dblclick ハンドラに追記する形で上書き）
svgEl.addEventListener('dblclick', e => {
  // 矢印ツール描画中は既存ハンドラが処理（ステップ7のcaptureが先に走る）
  if (state.tool === 'arrow' && state.drawing) return;
  // ウェイポイント削除は既存ハンドラが処理済み

  if (state.tool !== 'select') return;

  const { x, y } = svgPoint(e);

  // ウェイポイント削除との重複を避けるため先にチェック
  const _dblSel2 = getSingleSelection();
  if (_dblSel2?.type === 'arrow') {
    const arrow = state.arrows.get(_dblSel2.id);
    if (arrow && hitWaypointHandle(arrow, x, y) !== null) return;
  }

  const hit = hitTest(x, y);
  if (!hit) return;

  setSelection(hit.type, hit.id);
  render();
  openEditor(hit.type, hit.id);
});

// --- コンテキストメニューからの編集 ---
document.getElementById('ctx-edit').addEventListener('click', () => {
  hideCtxMenu();
  const s = getSingleSelection();
  if (s) openEditor(s.type, s.id);
});
document.getElementById('ctx-label').addEventListener('click', () => {
  hideCtxMenu();
  const s = getSingleSelection();
  if (s?.type === 'arrow') openEditor('arrow', s.id);
});

// キーボード: F2 でその場編集
document.addEventListener('keydown', e => {
  const s = getSingleSelection();
  if (e.key === 'F2' && s && !_editing) openEditor(s.type, s.id);
});

// ============================================================
// ステップ10: 保存・読込・仕上げ
// ============================================================

// --- 保存 (Ctrl+S) ---
function saveFile() {
  const json = serialize();
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'block-diagram.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showStatus('💾 保存しました: block-diagram.json');
}

document.getElementById('btn-save').addEventListener('click', saveFile);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveFile();
  }
});

// --- 読込 ---
const fileInput = document.getElementById('file-input');
document.getElementById('btn-load').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  fileInput.value = '';

  const reader = new FileReader();
  reader.onload = ev => {
    try {
      deserialize(ev.target.result);
      render();
      showStatus(`📂 読込完了: ${file.name}`);
    } catch {
      showStatus('❌ 読込失敗: JSONファイルを確認してください', 4000);
    }
  };
  reader.readAsText(file);
});

// --- PNG出力（背景なし・コンテンツのみ） ---
function exportPNG() {
  if (state.blocks.size === 0 && state.arrows.size === 0) {
    showStatus('出力するブロック/矢印がありません');
    return;
  }

  const PAD = 20;

  // ブロック・矢印全体のバウンディングボックスを計算
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const b of state.blocks.values()) {
    minX = Math.min(minX, b.x);       minY = Math.min(minY, b.y);
    maxX = Math.max(maxX, b.x + b.w); maxY = Math.max(maxY, b.y + b.h);
  }
  for (const arrow of state.arrows.values()) {
    for (const pt of arrowPoints(arrow)) {
      minX = Math.min(minX, pt.x); minY = Math.min(minY, pt.y);
      maxX = Math.max(maxX, pt.x); maxY = Math.max(maxY, pt.y);
    }
  }

  const vx = minX - PAD, vy = minY - PAD;
  const vw = maxX - minX + PAD * 2;
  const vh = maxY - minY + PAD * 2;

  // コンテンツレイヤーのみの一時SVGを構築（背景・グリッド・オーバーレイを除外）
  const tmpSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  tmpSvg.setAttribute('xmlns',   'http://www.w3.org/2000/svg');
  tmpSvg.setAttribute('width',   vw);
  tmpSvg.setAttribute('height',  vh);
  tmpSvg.setAttribute('viewBox', `${vx} ${vy} ${vw} ${vh}`);

  // マーカー定義をコピー（矢印ヘッドに必要）
  tmpSvg.appendChild(document.getElementById('svg-defs').cloneNode(true));

  // グループ枠・矢印・ブロックのみコピー
  for (const layerId of ['layer-groups', 'layer-arrows', 'layer-blocks']) {
    tmpSvg.appendChild(document.getElementById(layerId).cloneNode(true));
  }

  const svgStr  = new XMLSerializer().serializeToString(tmpSvg);
  const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url     = URL.createObjectURL(svgBlob);

  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width  = vw;
    canvas.height = vh;
    // 背景は透明のまま（fillRect しない）
    canvas.getContext('2d').drawImage(img, 0, 0, vw, vh);
    URL.revokeObjectURL(url);

    const a = document.createElement('a');
    a.download = 'block-diagram.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    showStatus('📷 PNGを保存しました');
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    showStatus('❌ PNG出力に失敗しました', 4000);
  };
  img.src = url;
}

document.getElementById('btn-png').addEventListener('click', exportPNG);

// --- クリア ---
document.getElementById('btn-clear').addEventListener('click', () => {
  if (!confirm('すべてクリアしますか？')) return;
  state.blocks.clear();
  state.arrows.clear();
  state.groups.clear();
  state.nextId    = 1;
  state.selections.clear();
  state.drag      = null;
  state.drawing   = null;
  render();
  showStatus('🗑 クリアしました');
});

// ============================================================
// Ctrl+Z / Ctrl+Y: 簡易アンドゥ・リドゥ
// ============================================================
const _history  = [];   // { json, selKeys }[]
const _future   = [];
const MAX_HIST  = 60;

function pushHistory() {
  _history.push({
    json    : serialize(),
    selKeys : [...state.selections.keys()],
  });
  if (_history.length > MAX_HIST) _history.shift();
  _future.length = 0;
}

function applySnapshot(snap) {
  deserialize(snap.json);
  // 選択状態を復元
  (snap.selKeys ?? []).forEach(k => {
    const [type, idStr] = k.split('-');
    const id = Number(idStr);
    const exists = type === 'block' ? state.blocks.has(id) : state.arrows.has(id);
    if (exists) state.selections.set(k, { type, id });
  });
  render();
}

function withHistory(fn) { pushHistory(); fn(); }

// Ctrl+Z
document.addEventListener('keydown', e => {
  if (_editing) return;
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === 'z') {
    e.preventDefault();
    if (_history.length === 0) return;
    _future.push({ json: serialize(), selKeys: [...state.selections.keys()] });
    applySnapshot(_history.pop());
    showStatus('↩ アンドゥ');
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'z'))) {
    e.preventDefault();
    if (_future.length === 0) return;
    _history.push({ json: serialize(), selKeys: [...state.selections.keys()] });
    applySnapshot(_future.pop());
    showStatus('↪ リドゥ');
  }
});

// アンドゥ記録フラグ: 各操作の先頭で直接呼ぶ（関数再宣言による無限再帰を避ける）
// onDragEnd → document mouseup ハンドラ側で記録
// finishArrow / deleteSelected / closeEditor は各関数の先頭に pushHistory() を直接追記済み
// ※ function宣言の重複ラップはホイスティングで無限再帰になるため使用しない

// ============================================================
// カラーピッカー
// ============================================================
const colorPicker = document.getElementById('color-picker');

// 12色スウォッチを生成
PALETTE.forEach(hex => {
  const sw = document.createElement('div');
  sw.className    = 'cp-swatch';
  sw.style.background = hex;
  sw.title        = hex;
  sw.dataset.color = hex;
  colorPicker.appendChild(sw);
});

/** 選択中要素の現在色を返す */
function getSelectedColor() {
  // 選択中の最初の要素の色を返す（複数選択時は代表色）
  const sels = getSelections();
  if (sels.length === 0) return null;
  const first = sels[0];
  if (first.type === 'block') {
    return (state.blocks.get(first.id) ?? {}).color ?? DEFAULT_BLOCK_COLOR;
  } else {
    return (state.arrows.get(first.id) ?? {}).color ?? DEFAULT_ARROW_COLOR;
  }
}

/** カラーピッカーを表示してアクティブ色を反映 */
function updateColorPicker() {
  const cnt = state.selections.size;
  if (cnt === 0) {
    colorPicker.classList.remove('show');
    return;
  }
  colorPicker.classList.add('show');
  const cur = getSelectedColor();
  colorPicker.querySelectorAll('.cp-swatch').forEach(sw => {
    sw.classList.toggle('active', sw.dataset.color === cur);
  });
}

// スウォッチクリック → 選択中の全要素に色を適用
colorPicker.addEventListener('click', e => {
  const sw = e.target.closest('.cp-swatch');
  if (!sw || state.selections.size === 0) return;

  const hex = sw.dataset.color;
  pushHistory();

  for (const { type, id } of getSelections()) {
    if (type === 'block') {
      const b = state.blocks.get(id);
      if (b) b.color = hex;
    } else {
      const a = state.arrows.get(id);
      if (a) a.color = hex;
    }
  }
  render();
  updateColorPicker();
});
